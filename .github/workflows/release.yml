name: Android release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check release version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: |
          npm test -- --runInBand
          npx --no-install tsc --noEmit
          npm run lint
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Build and validate release
        working-directory: android
        run: |
          bash ./gradlew --no-daemon --console=plain \
            :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease
      - name: Verify and package APK
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          version = json.loads(Path("package.json").read_text())["version"]
          badging = (Path(os.environ["RUNNER_TEMP"]) / "apk-badging.txt").read_text()
          assert "package: name='com.sleeptimer'" in badging
          assert f"versionName='{version}'" in badging
          assert "application-debuggable" not in badging
          with ZipFile("android/app/build/outputs/apk/release/app-release.apk") as apk:
              assert apk.getinfo("assets/index.android.bundle").file_size > 100_000
              for arch in ("armeabi-v7a", "arm64-v8a", "x86", "x86_64"):
                  assert any(name.startswith(f"lib/{arch}/") for name in apk.namelist())
          PY
          asset="audible-sleep-timer-$GITHUB_REF_NAME.apk"
          cp "$apk" "$RUNNER_TEMP/$asset"
          cd "$RUNNER_TEMP"
          sha256sum "$asset" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Audible Sleep Timer $GITHUB_REF_NAME" \
            --generate-notes \
            --latest \
            "$RUNNER_TEMP/audible-sleep-timer-$GITHUB_REF_NAME.apk" \
            "$RUNNER_TEMP/SHA256SUMS.txt"
